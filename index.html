<script>
(()=>{const NS='http://www.w3.org/2000/svg',reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const layer=document.querySelector('#npcs'),traces=document.querySelector('#traces'),tip=document.querySelector('#tooltip'),viewport=document.querySelector('#viewport'),pause=document.querySelector('#pause'),state=document.querySelector('#state'),activity=document.querySelector('#activity');let running=!reduced,last=performance.now(),cycles=1,edits=0;const roles=[['Mara','tests unfinished rules','HOW + LAB'],['Ivo','carries prototypes between bays','LAB + STREETS'],['Nia','waits where routes cross','STREETS'],['Sol','misuses movable parts','PLAY + STREETS'],['Aya','keeps old marks visible','CHANGE'],['Teo','returns altered material','AGAIN + HOW'],['Luz','checks temporary joints','LAB + CHANGE'],['Ren','opens paths for others','STREETS + PLAY'],['Uma','observes before changing','HOW + STREETS'],['Bo','rebuilds while occupied','CHANGE + PLAY'],['Eli','passes methods person to person','STREETS'],['Noa','loops without repeating','AGAIN + LAB']];const paths=[0,1,2,3,4,5,6,7,0,3,2,6].map(i=>document.querySelector('#route'+i));function el(tag,attrs={}){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}const people=roles.map((role,i)=>{const g=el('g',{class:'npc',tabindex:'0',role:'img','aria-label':`${role[0]}: ${role[1]}`});g.innerHTML='<g class="person"><circle cx="0" cy="-8" r="3.2"/><path d="M0-4v10M0-1l-5 5M0-1l5 5M0 6l-4 8M0 6l4 8" fill="none"/></g>';layer.append(g);return{g,role,path:paths[i],p:(i*.137)%1,v:.00018+(i%4)*.000025,dir:i%3===0?-1:1,still:0}});function personTip(p,e){tip.innerHTML=`<b>${p.role[0]}</b><br>${p.role[1]}<br><span style="color:#d78673">related: ${p.role[2]}</span>`;tip.classList.add('show');const r=viewport.getBoundingClientRect(),x=(e.clientX||r.left+40)-r.left,y=(e.clientY||r.top+40)-r.top;tip.style.left=Math.min(x+10,r.width-255)+'px';tip.style.top=Math.min(y+10,r.height-92)+'px'}people.forEach(p=>{p.g.addEventListener('pointerenter',e=>{p.still=1;personTip(p,e)});p.g.addEventListener('pointermove',e=>personTip(p,e));p.g.addEventListener('pointerleave',()=>{p.still=0;tip.classList.remove('show')});p.g.addEventListener('focus',e=>{p.still=1;personTip(p,e)});p.g.addEventListener('blur',()=>{p.still=0;tip.classList.remove('show')})});function tick(now){const dt=Math.min(now-last,48);last=now;if(running)people.forEach((p,i)=>{if(!p.still){p.p+=p.v*p.dir*dt/16;if(p.p>1||p.p<0){p.dir*=-1;p.p=Math.max(0,Math.min(1,p.p));if(i===5||i===11){cycles++;state.textContent='inhabited / cycle '+String(cycles).padStart(3,'0')}}}const L=p.path.getTotalLength(),a=p.path.getPointAtLength(p.p*L),b=p.path.getPointAtLength(Math.min(L,p.p*L+1));const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;p.g.setAttribute('transform',`translate(${a.x} ${a.y-2}) rotate(${p.dir<0?ang+180:ang})`)});requestAnimationFrame(tick)}requestAnimationFrame(tick);function trace(d){const p=el('path',{class:'trace new',d});traces.append(p);while(traces.children.length>20)traces.firstElementChild.remove()}const actions={HOW(){trace(`M${110+edits%4*7} 315c22-16 51-18 84-6M${115+edits%3*9} 321c20-12 47-14 76-7`)},LAB(){const g=document.querySelector('#labGrowth'),x=257+(edits%5)*51,y=480-(edits%3)*18,p=el('path',{class:'trace new',d:`M${x} ${y}v-28h35v28m-29-22l23 0m-12-12v12`});g.append(p);while(g.children.length>9)g.firstElementChild.remove()},STREETS(){trace(`M${610+edits%5*48} ${454-edits%2*94}q14-18 28 0t28 0`)},PLAY(){const pos=[[900,283],[979,274],[1048,290]];document.querySelectorAll('.loose-part').forEach((p,i)=>{const q=pos[(i+edits+1)%3];p.setAttribute('transform',`translate(${q[0]} ${q[1]}) rotate(${(i-edits%3)*2})`)})},CHANGE(){const p=document.querySelector('#patch'),xs=[1148,1180,1225,1253],ys=[344,454,560];p.setAttribute('x',xs[edits%4]);p.setAttribute('y',ys[edits%3]);trace(`M${1138+edits%4*39} ${438+edits%3*52}l18-12 22 18 15-9`)},AGAIN(){trace(`M${1290-edits%5*20} ${680+edits%2*8}C1100 ${725+edits%3*4} 800 670 520 710S220 730 95 675`)}};document.querySelectorAll('.hotspot').forEach(h=>{const run=()=>{edits++;actions[h.dataset.zone]();activity.textContent=`12 occupants / ${String(edits).padStart(2,'0')} live alterations`};h.addEventListener('click',run);h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();run()}})});pause.textContent=running?'pause movement':'resume movement';pause.setAttribute('aria-pressed',String(!running));pause.addEventListener('click',()=>{running=!running;pause.textContent=running?'pause movement':'resume movement';pause.setAttribute('aria-pressed',String(!running))})})();
</script>
