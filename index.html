  function frame(now){const dt=Math.min(45,now-last);last=now;if(!reduced){workers.forEach(w=>{const L=w.path.getTotalLength();if(!w.paused&&!w.stationary){const contact=Math.abs(Math.sin(Math.PI*2*(now+w.phase)/w.gait)),footfall=(w.runner?.42:.3)+(w.runner?.58:.7)*Math.pow(contact,2);w.p+=(w.speed*dt/L)*w.dir*footfall;if(w.p>1||w.p<0){w.dir*=-1;w.p=Math.max(0,Math.min(1,w.p))}}const pt=w.path.getPointAtLength(w.p*L),f=w.dir<0?-1:1,sole=w.g.classList.contains('sitter')?12:w.g.classList.contains('stander')?18:w.g.classList.contains('dancer')?16:w.runner?16:17;w.g.setAttribute('transform',`translate(${pt.x.toFixed(2)} ${(pt.y-sole).toFixed(2)}) scale(${f} 1)`) });const t=now/1000;if(balloon?.dataset.paused!=='true'){const bob=Math.sin(t*.55)*3;balloon.setAttribute('transform',`translate(0 ${bob.toFixed(2)})`);if(balloonTether)balloonTether.setAttribute('d',`M1190 ${(161+bob).toFixed(2)}V226`)}if(cable&&cableRail&&cable.dataset.paused!=='true'){const p=(t*.045)%1,L=cableRail.getTotalLength(),pt=cableRail.getPointAtLength(p*L);cable.setAttribute('transform',`translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)})`)}if(hoist?.dataset.paused!=='true')hoist.setAttribute('transform',`translate(0 ${(Math.sin(t*.7)*10).toFixed(2)})`);if(rotor?.dataset.paused!=='true')rotor.setAttribute('transform',`rotate(${(Math.sin(t*.75)*5).toFixed(2)} 997 357)`);if(shuttle&&shuttleRail&&shuttle.dataset.paused!=='true'){const p=(Math.sin(t*.32)+1)/2,L=shuttleRail.getTotalLength(),pt=shuttleRail.getPointAtLength(p*L);shuttle.setAttribute('transform',`translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)})`)}if(train&&trainRail&&train.dataset.paused!=='true'){const p=(t*.035)%1,L=trainRail.getTotalLength(),pt=trainRail.getPointAtLength(p*L);train.setAttribute('transform',`translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)})`)}}requestAnimationFrame(frame)}requestAnimationFrame(frame)
})();
</script>
<script>
(()=>{
  const svg=document.querySelector('#section'),guide=document.querySelector('#tourGuide'),button=document.querySelector('#tourPlay'),panel=document.querySelector('#tourNarration'),viewport=document.querySelector('#viewport');
  if(!svg||!guide||!button||!panel||!viewport)return;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,overview=[0,0,1400,760],scale=1.35;
  const steps=[
    {title:'HOW',summary:'Begin with a strong practice — a form, interaction, visual language or system that makes you want to start making.',dialogue:['GUIDE — “Which way of doing makes you want to begin?”','MARA — “I collect the spark, not a finished solution.”'],view:[20,150,400,500],pos:[112,357]},
    {title:'LAB',summary:'Make the question tangible. Build, compare, break and keep the evidence.',dialogue:['GUIDE — “What did the test change?”','IVO — “The difference becomes visible when both materials meet the same test.”'],view:[205,180,440,430],pos:[326,357]},
    {title:'UPSIDE-DOWN',summary:'Reverse the room to expose assumptions that only work one way up.',dialogue:['GUIDE — “What happens if gravity changes?”','PAX — “The hidden rule becomes visible from the ceiling.”'],view:[205,515,430,205],pos:[430,640]},
    {title:'STREETS',summary:'Methods circulate through meetings, stairs, bridges and unfinished handovers.',dialogue:['GUIDE — “Who changes the work while it travels?”','SOL — “Everyone who passes it on leaves a trace.”'],view:[470,175,555,455],pos:[670,327]},
    {title:'PLAY',summary:'Re-mix parts, change their order and test an unexpected use.',dialogue:['GUIDE — “Can the wrong use teach us something?”','TEO — “Play reveals arrangements a plan cannot predict.”'],view:[780,150,455,485],pos:[970,382]},
    {title:'REFINE',summary:'Ask the 5W questions again: why, what, who, when and where?',dialogue:['GUIDE — “What should actually change?”','LUZ — “Only what the evidence asks us to revise.”'],view:[1030,150,370,550],pos:[1210,482]},
    {title:'AGAIN',summary:'Keep the trace, return the useful parts and begin another—not identical—cycle.',dialogue:['GUIDE — “Is this the final state?”','BO — “No. The outcome becomes material for the next question.”'],view:[70,515,1060,245],pos:[850,678]}
  ];
  let playing=false,index=-1,timer=0,animationToken=0,guideToken=0,currentPos=[112,357];
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  function currentView(){return svg.getAttribute('viewBox').trim().split(/\s+/).map(Number)}
  function animateView(target,duration=950){const from=currentView(),token=++animationToken;if(reduced){svg.setAttribute('viewBox',target.join(' '));return}const start=performance.now();function frame(now){if(token!==animationToken)return;const p=Math.min(1,(now-start)/duration),e=ease(p),v=from.map((n,i)=>n+(target[i]-n)*e);svg.setAttribute('viewBox',v.join(' '));if(p<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
  function animateGuide(target,duration=2600){const from=[...currentPos],face=target[0]>=from[0]?1:-1,token=++guideToken;guide.classList.add('moving');if(reduced){currentPos=[...target];guide.setAttribute('transform',`translate(${target[0]} ${target[1]}) scale(${face*scale} ${scale})`);guide.classList.remove('moving');return}const start=performance.now();function frame(now){if(token!==guideToken)return;const p=Math.min(1,(now-start)/duration),e=ease(p),x=from[0]+(target[0]-from[0])*e,y=from[1]+(target[1]-from[1])*e;guide.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${face*scale} ${scale})`);if(p<1)requestAnimationFrame(frame);else{currentPos=[...target];guide.classList.remove('moving')}}requestAnimationFrame(frame)}
  function renderStep(step,i){panel.innerHTML=`<div class="tour-count">${String(i+1).padStart(2,'0')} / ${String(steps.length).padStart(2,'0')}</div><h2>${step.title}</h2><p class="tour-summary">${step.summary}</p><p class="tour-dialogue"><span>${step.dialogue[0]}</span><span>${step.dialogue[1]}</span></p>`;panel.classList.add('show')}
  function showStep(i){if(!playing)return;if(i>=steps.length){finish();return}index=i;const step=steps[i];renderStep(step,i);animateView(step.view);animateGuide(step.pos);timer=setTimeout(()=>showStep(i+1),5200)}
  function start(){clearTimeout(timer);playing=true;index=-1;viewport.classList.add('tour-active');button.setAttribute('aria-pressed','true');button.innerHTML='<span class="play-mark">■</span> STOP';showStep(0)}
  function resetGuide(){currentPos=[112,357];guide.classList.remove('moving');guide.setAttribute('transform',`translate(112 357) scale(${scale})`)}
  function stop(){clearTimeout(timer);playing=false;animationToken++;guideToken++;viewport.classList.remove('tour-active');panel.classList.remove('show');button.setAttribute('aria-pressed','false');button.innerHTML='<span class="play-mark">▶</span> PLAY';svg.setAttribute('viewBox',overview.join(' '));resetGuide()}
  function finish(){clearTimeout(timer);playing=false;animateView(overview,1200);viewport.classList.remove('tour-active');button.setAttribute('aria-pressed','false');button.innerHTML='<span class="play-mark">↻</span> REPLAY';panel.innerHTML='<div class="tour-count">OPEN LOOP</div><h2>AGAIN</h2><p class="tour-summary">The process remains visible through the outcome.</p><p class="tour-dialogue"><span>No final state — return with a changed question.</span></p>';setTimeout(resetGuide,900)}
  button.addEventListener('click',()=>playing?stop():start());
})();
</script>
