<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="A living methodology map: HOW → MAKE → PLAY → CHANGE → AGAIN.">
  <title>HOW / AGAIN — A Method City</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f5f4ef'/%3E%3Cpath d='M5 9h12v7h10v9H12v-6H5zM8 5v22M24 6v21' fill='none' stroke='%23131313' stroke-width='2'/%3E%3Ccircle cx='8' cy='9' r='2' fill='%23ef5b3f'/%3E%3C/svg%3E">
  <style>
    :root { --paper:#f5f4ef; --ink:#121212; --muted:#696963; --accent:#ed5a3d; --line:1.25px; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--paper); color:var(--ink); }
    body { font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; overflow:hidden; }
    button { font:inherit; color:inherit; }
    .shell { height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; padding:clamp(12px,2vw,28px); gap:10px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; border-top:var(--line) solid; padding-top:8px; }
    .title { margin:0; font-size:clamp(1rem,1.8vw,1.55rem); line-height:1; letter-spacing:-.04em; font-weight:750; }
    .title .slash { color:var(--accent); }
    .route-label { margin:.35rem 0 0; font:600 clamp(.68rem,.85vw,.78rem)/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.08em; }
    .top-meta { display:flex; align-items:center; gap:12px; font:600 .7rem/1 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase; letter-spacing:.08em; }
    .live { display:inline-flex; gap:6px; align-items:center; }
    .live::before { content:""; width:7px; height:7px; border:1px solid; border-radius:50%; background:var(--accent); }
    #pause { appearance:none; border:1px solid var(--ink); background:transparent; padding:6px 9px; cursor:pointer; text-transform:uppercase; }
    #pause:hover, #pause:focus-visible { background:var(--ink); color:var(--paper); outline:none; }
    main { min-height:0; position:relative; width:min(100%,calc((100dvh - 145px) * 1.723)); aspect-ratio:1120/650; align-self:center; justify-self:center; border:var(--line) solid var(--ink); background-image:linear-gradient(to right,rgba(18,18,18,.035) 1px,transparent 1px),linear-gradient(to bottom,rgba(18,18,18,.035) 1px,transparent 1px); background-size:24px 24px; overflow:hidden; }
    svg { width:100%; height:100%; display:block; }
    .route { fill:none; stroke:var(--ink); stroke-width:1.25; stroke-dasharray:5 6; vector-effect:non-scaling-stroke; }
    .route.secondary { opacity:.35; stroke-dasharray:2 7; }
    .structure, .detail { fill:none; stroke:var(--ink); vector-effect:non-scaling-stroke; }
    .structure { stroke-width:1.4; }
    .detail { stroke-width:.85; }
    .accent-stroke { stroke:var(--accent); }
    .zone { cursor:pointer; }
    .zone .plate { fill:var(--paper); stroke:var(--ink); stroke-width:1.4; vector-effect:non-scaling-stroke; transition:fill .18s; }
    .zone:hover .plate, .zone:focus .plate, .zone.active .plate { fill:#fff; }
    .zone:focus { outline:none; }
    .zone:focus .plate { stroke:var(--accent); stroke-width:2.5; }
    .zone-title { font-size:19px; font-weight:800; letter-spacing:-.04em; }
    .zone-index, .micro { font:600 7.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.08em; }
    .micro { font-weight:500; }
    .zone-note { font:500 9px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .module rect { fill:var(--paper); stroke:var(--ink); stroke-width:1; vector-effect:non-scaling-stroke; }
    .module text { font:600 7px/1 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .module { transition:transform .65s cubic-bezier(.22,.7,.25,1), opacity .25s; }
    .npc .head { fill:var(--paper); stroke:var(--ink); stroke-width:1.2; vector-effect:non-scaling-stroke; }
    .npc .body { fill:none; stroke:var(--ink); stroke-width:1.4; stroke-linecap:round; vector-effect:non-scaling-stroke; }
    .npc .tag { font:700 6px/1 ui-monospace,SFMono-Regular,Menlo,monospace; fill:var(--accent); }
    .event-ring { fill:none; stroke:var(--accent); stroke-width:1.25; vector-effect:non-scaling-stroke; opacity:0; }
    .event-ring.fire { animation:ring 1s ease-out; }
    @keyframes ring { 0%{opacity:1;r:4} 100%{opacity:0;r:24} }
    #tooltip { position:absolute; max-width:230px; pointer-events:none; background:var(--ink); color:var(--paper); padding:9px 11px; font:500 .72rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; opacity:0; transform:translateY(5px); transition:.15s; z-index:4; }
    #tooltip.show { opacity:1; transform:none; }
    .event-log { position:absolute; right:12px; top:12px; width:min(210px,24vw); border:1px solid var(--ink); background:rgba(245,244,239,.94); padding:9px; }
    .event-log h2 { margin:0 0 7px; font:700 .65rem/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.09em; }
    #events { margin:0; padding:0; list-style:none; display:grid; gap:4px; font:500 .62rem/1.25 ui-monospace,SFMono-Regular,Menlo,monospace; }
    #events li { display:grid; grid-template-columns:36px 1fr; gap:6px; }
    #events time { color:var(--accent); }
    footer { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; border-bottom:var(--line) solid; padding-bottom:8px; }
    .instruction { margin:0; max-width:68ch; font-size:clamp(.72rem,.9vw,.82rem); line-height:1.35; }
    .counter { font:600 .68rem/1.25 ui-monospace,SFMono-Regular,Menlo,monospace; text-align:right; }
    #count { color:var(--accent); }
    @media (max-width:720px) {
      body { overflow:auto; }
      .shell { min-height:100dvh; height:auto; grid-template-rows:auto auto auto; padding:10px; }
      main { min-height:72vh; width:100%; aspect-ratio:auto; }
      svg { min-width:880px; }
      main { overflow:auto hidden; }
      .event-log { position:sticky; left:8px; width:180px; }
      footer { grid-template-columns:1fr; }
      .counter { text-align:left; }
      .top-meta > span:first-child { display:none; }
    }
    @media (prefers-reduced-motion:reduce) { .event-ring.fire { animation:none; } .module { transition:none; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div><h1 class="title">HOW <span class="slash">/</span> AGAIN</h1><p class="route-label">METHOD CITY — OPEN SYSTEM No. 01</p></div>
      <div class="top-meta"><span class="live">system live</span><span id="cycleLabel">cycle 001</span><button id="pause" type="button" aria-pressed="false">Pause</button></div>
    </header>
    <main id="mapWrap" aria-label="Interactive methodology city map">
      <svg id="city" viewBox="0 0 1120 650" role="img" aria-labelledby="mapTitle mapDesc">
        <title id="mapTitle">A looping methodology represented as a miniature city</title>
        <desc id="mapDesc">Nine tiny people travel between HOW, LAB, STREETS, PLAY, CHANGE, and AGAIN, creating and mutating text modules.</desc>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#121212"/></marker>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#121212" stroke-width=".7"/></pattern>
        </defs>

        <path id="mainRoute" class="route" marker-end="url(#arrow)" d="M105 185 C150 92 255 92 318 160 S440 300 535 325 S675 215 760 180 S920 130 997 220 S1010 430 890 490 S670 525 555 520 S350 545 225 480 S64 350 105 185"/>
        <path class="route secondary" d="M180 300 C300 230 380 430 510 375 S700 295 820 365 S915 445 1010 370"/>
        <path class="route secondary" d="M280 105 C380 35 570 80 640 140 S760 300 930 290"/>

        <g class="zone" data-zone="HOW" tabindex="0" role="button" aria-label="HOW: start a method, rule, or idea" transform="translate(42 88)">
          <rect class="plate" width="190" height="122"/><text class="zone-index" x="12" y="18">01 / ENTRY</text><text class="zone-title" x="12" y="47">HOW</text>
          <path class="detail" d="M12 62H178M12 76H90M112 76H178M12 90H62M72 90H154M12 106H178"/><circle cx="166" cy="89" r="8" fill="none" stroke="#ed5a3d"/>
          <text class="micro" x="112" y="73">RULE / IDEA</text>
        </g>

        <g class="zone" data-zone="LAB" tabindex="0" role="button" aria-label="LAB: experiment, test, and prototype" transform="translate(302 70)">
          <path class="plate" d="M0 0H224V150H176V178H0Z"/><text class="zone-index" x="12" y="18">02 / TEST YARD</text><text class="zone-title" x="12" y="47">LAB</text>
          <path class="detail" d="M14 70h48v38H14zm66 0h48v38H80zm66 0h44v38h-44M20 125h170M28 125v28m28-28v28m28-28v28m28-28v28m28-28v28m28-28v28"/>
          <text class="micro" x="16" y="66">PROTOTYPE BAYS</text><g id="labModules"></g>
        </g>

        <g class="zone" data-zone="STREETS" tabindex="0" role="button" aria-label="STREETS: circulation, encounters, and exchange" transform="translate(430 280)">
          <path class="plate" d="M0 0H252V36H306V128H252V164H0V128H-52V36H0Z"/><text class="zone-index" x="12" y="18">03 / COMMON GROUND</text><text class="zone-title" x="12" y="70">STREETS</text>
          <path class="detail" d="M0 36h252M0 128h252M54 36v92m144-92v92M-52 82h358M82 50l88 64m0-64-88 64"/>
          <text class="micro" x="88" y="151">MEET / PASS / EXCHANGE</text><circle id="streetRing" class="event-ring" cx="126" cy="82" r="4"/>
        </g>

        <g class="zone" data-zone="PLAY" tabindex="0" role="button" aria-label="PLAY: recombine, misuse, and reorder" transform="translate(738 62)">
          <path class="plate" d="M0 28L34 0H235V166H0Z"/><text class="zone-index" x="14" y="47">04 / OPEN USE</text><text class="zone-title" x="14" y="78">PLAY</text>
          <g id="playModules">
            <g class="module" data-slot="0" transform="translate(18 96)"><rect width="52" height="28"/><text x="6" y="17">RE-MIX</text></g>
            <g class="module" data-slot="1" transform="translate(82 96)"><rect width="52" height="28"/><text x="6" y="17">MIS-USE</text></g>
            <g class="module" data-slot="2" transform="translate(146 96)"><rect width="68" height="28"/><text x="6" y="17">RE-ORDER</text></g>
          </g>
          <path class="detail" d="M16 138h198M32 138v18m32-18v18m32-18v18m32-18v18m32-18v18m32-18v18"/>
        </g>

        <g class="zone" data-zone="CHANGE" tabindex="0" role="button" aria-label="CHANGE: mutate, refine, and modify locally" transform="translate(820 310)">
          <path class="plate" d="M0 0H242V160H200V190H0Z"/><text class="zone-index" x="12" y="18">05 / REVISION WORKS</text><text class="zone-title" x="12" y="48">CHANGE</text>
          <g id="changeGrid" class="detail"><path d="M14 70h210v72H14zM56 70v72m42-72v72m42-72v72m42-72v72M14 106h210"/></g>
          <rect id="changeCell" x="99" y="107" width="40" height="34" fill="url(#hatch)" stroke="#121212"/>
          <text class="micro" x="14" y="156">LOCAL EDIT / KEEP TRACE</text>
        </g>

        <g class="zone" data-zone="AGAIN" tabindex="0" role="button" aria-label="AGAIN: loop and recirculate" transform="translate(110 408)">
          <path class="plate" d="M0 0H218V160H32L0 128Z"/><text class="zone-index" x="12" y="18">06 / RETURN LOOP</text><text class="zone-title" x="12" y="52">AGAIN</text>
          <path class="detail" marker-end="url(#arrow)" d="M28 102c0-26 22-42 52-42 40 0 58 24 58 48s-20 35-38 35c-22 0-34-12-34-28s14-24 29-24"/>
          <text class="micro" x="122" y="116">RE-ENTER</text><text id="againCount" class="zone-note" x="150" y="144">000 LOOPS</text>
        </g>

        <g class="structure" opacity=".8">
          <path d="M14 32H1098M14 618H1098M26 24v602m1068-602v602"/>
          <path d="M26 48h86l14-16 14 16h108l14-16 14 16h108l14-16 14 16h108l14-16 14 16h108l14-16 14 16h108l14-16 14 16h108"/>
        </g>
        <g class="micro" fill="#121212"><text x="38" y="611">OPEN ACCESS / NO FINAL STATE</text><text x="894" y="611">PROCESS REMAINS VISIBLE</text></g>
        <g id="npcs"></g>
      </svg>
      <aside class="event-log" aria-live="polite"><h2>FIELD NOTES / LIVE</h2><ol id="events"><li><time>00:00</time><span>system opened</span></li></ol></aside>
      <div id="tooltip" role="tooltip"></div>
    </main>
    <footer>
      <p class="instruction">Watch the residents carry ideas through the city. Hover a district to read its role; click or press Enter to make a local intervention.</p>
      <div class="counter">PROTOTYPES <span id="count">000</span><br>THE OUTCOME KEEPS ITS HISTORY</div>
    </footer>
  </div>
  <script>
    (() => {
      const ns = 'http://www.w3.org/2000/svg';
      const route = document.querySelector('#mainRoute');
      const npcLayer = document.querySelector('#npcs');
      const labLayer = document.querySelector('#labModules');
      const events = document.querySelector('#events');
      const countEl = document.querySelector('#count');
      const cycleEl = document.querySelector('#cycleLabel');
      const againEl = document.querySelector('#againCount');
      const pause = document.querySelector('#pause');
      const tooltip = document.querySelector('#tooltip');
      const wrap = document.querySelector('#mapWrap');
      const total = route.getTotalLength();
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let running = !reduced, last = performance.now(), prototypes = 0, loops = 0, mutations = 0, startTime = performance.now();
      const descriptions = {
        HOW:'A method enters as a proposal — useful, unfinished, and open to others.',
        LAB:'Tests turn proposals into small, portable text modules.',
        STREETS:'Residents cross paths; modules are exchanged and altered in transit.',
        PLAY:'Parts are recombined, misused, and reordered without a fixed winner.',
        CHANGE:'A local edit modifies the system while leaving its previous structure legible.',
        AGAIN:'Results recirculate as new inputs. The loop never returns exactly the same.'
      };
      const phases = [
        {at:.09, zone:'HOW'}, {at:.24, zone:'LAB'}, {at:.43, zone:'STREETS'},
        {at:.60, zone:'PLAY'}, {at:.76, zone:'CHANGE'}, {at:.93, zone:'AGAIN'}
      ];
      const people = Array.from({length:9}, (_,i) => ({ id:i+1, t:(i/9+.015)%1, speed:.00042+(i%4)*.000055, phase:-1, lap:0, el:null }));

      function svgEl(tag, attrs={}) { const el=document.createElementNS(ns,tag); Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v)); return el; }
      people.forEach(p => {
        const g=svgEl('g',{class:'npc','aria-hidden':'true'});
        g.innerHTML='<circle class="head" cy="-7" r="3.2"/><path class="body" d="M0-3v10M0 1l-5 4M0 1l5 4M0 7l-4 7M0 7l4 7"/><text class="tag" x="7" y="-5">'+String(p.id).padStart(2,'0')+'</text>';
        npcLayer.append(g); p.el=g;
      });
      function stamp(text) {
        const sec=Math.floor((performance.now()-startTime)/1000), time=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
        const li=document.createElement('li'); li.innerHTML='<time>'+time+'</time><span>'+text+'</span>'; events.prepend(li); while(events.children.length>5) events.lastElementChild.remove();
      }
      function labEvent(actor='visitor') {
        prototypes++; countEl.textContent=String(prototypes).padStart(3,'0');
        const g=svgEl('g',{class:'module',transform:`translate(${18+(prototypes%5)*37} ${116+(prototypes%2)*18})`});
        g.innerHTML=`<rect width="31" height="14"/><text x="4" y="10">M-${String(prototypes).padStart(2,'0')}</text>`; labLayer.append(g); while(labLayer.children.length>8) labLayer.firstElementChild.remove();
        stamp(`${actor} made module M-${String(prototypes).padStart(2,'0')}`);
      }
      function streetEvent(actor='two residents') {
        const ring=document.querySelector('#streetRing'); ring.classList.remove('fire'); void ring.getBBox(); ring.classList.add('fire');
        stamp(`${actor} exchanged a method`);
      }
      function playEvent(actor='visitor') {
        const modules=[...document.querySelectorAll('#playModules .module')];
        const slots=['translate(18 96)','translate(82 96)','translate(146 96)'];
        modules.forEach((m,i)=>m.setAttribute('transform',slots[(i+1+mutations)%3]+` rotate(${(mutations%3-1)*3})`));
        stamp(`${actor} reordered the play yard`);
      }
      function changeEvent(actor='visitor') {
        mutations++; const cell=document.querySelector('#changeCell');
        const xs=[15,57,99,141,183], ys=[71,107]; cell.setAttribute('x',xs[mutations%xs.length]); cell.setAttribute('y',ys[mutations%2]);
        cell.setAttribute('fill',mutations%2?'#ed5a3d':'url(#hatch)'); stamp(`${actor} kept mutation ${String(mutations).padStart(2,'0')}`);
      }
      function againEvent(actor='visitor') { loops++; againEl.textContent=String(loops).padStart(3,'0')+' LOOPS'; cycleEl.textContent='cycle '+String(Math.floor(loops/9)+1).padStart(3,'0'); stamp(`${actor} returned carrying change`); }
      const actions={HOW:(a)=>stamp(`${a} proposed a rule`),LAB:labEvent,STREETS:streetEvent,PLAY:playEvent,CHANGE:changeEvent,AGAIN:againEvent};
      function trigger(zone, actor) { document.querySelector(`[data-zone="${zone}"]`).classList.add('active'); setTimeout(()=>document.querySelector(`[data-zone="${zone}"]`).classList.remove('active'),500); actions[zone](actor); }
      function animate(now) {
        const dt=Math.min(48,now-last); last=now;
        if(running) people.forEach(p => {
          const old=p.t; p.t=(p.t+p.speed*dt/16)%1;
          phases.forEach((phase,index)=>{ if((old<phase.at&&p.t>=phase.at)||(old>p.t&&phase.at<.12)){ if(p.phase!==index){ p.phase=index; trigger(phase.zone,`resident ${String(p.id).padStart(2,'0')}`); } } });
          const point=route.getPointAtLength(p.t*total), next=route.getPointAtLength(((p.t+.002)%1)*total); const angle=Math.atan2(next.y-point.y,next.x-point.x)*180/Math.PI;
          p.el.setAttribute('transform',`translate(${point.x} ${point.y}) rotate(${angle})`);
        });
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
      pause.textContent=running?'Pause':'Run'; pause.setAttribute('aria-pressed',String(!running));
      pause.addEventListener('click',()=>{ running=!running; pause.textContent=running?'Pause':'Run'; pause.setAttribute('aria-pressed',String(!running)); stamp(running?'system resumed':'system paused'); });
      document.querySelectorAll('.zone').forEach(zone => {
        const name=zone.dataset.zone;
        const show=e=>{ tooltip.textContent=descriptions[name]; tooltip.classList.add('show'); const rect=wrap.getBoundingClientRect(); const x=('clientX'in e&&e.clientX?e.clientX-rect.left:20), y=('clientY'in e&&e.clientY?e.clientY-rect.top:55); tooltip.style.left=Math.min(x+12,rect.width-245)+'px'; tooltip.style.top=Math.min(y+12,rect.height-80)+'px'; };
        zone.addEventListener('pointerenter',show); zone.addEventListener('pointermove',show); zone.addEventListener('pointerleave',()=>tooltip.classList.remove('show'));
        zone.addEventListener('focus',show); zone.addEventListener('blur',()=>tooltip.classList.remove('show'));
        zone.addEventListener('click',()=>trigger(name,'you'));
        zone.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();trigger(name,'you');} });
      });
      if(reduced) stamp('motion paused by system preference');
    })();
  </script>
</body>
</html>
